services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tourist}
      POSTGRES_USER: ${POSTGRES_USER:-tourist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tourist}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tourist} -d ${POSTGRES_DB:-tourist}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tourist}
      POSTGRES_USER: ${POSTGRES_USER:-tourist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tourist}
    ports:
      - "5050:5000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
